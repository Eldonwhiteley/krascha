# Deploys the leaderboard Worker to krascha.com once check passes on master.
# The deploy also tells the CLI which commit is newest, so Krascha updates
# himself only to a build that passed check. Needs the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repo secrets.

name: deploy

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# Never cancel a deploy halfway through a migration, just queue the next one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Only pushes, so a pull request from a fork's master branch can't deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy the commit check passed, not whatever master is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/deploy-worker.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
