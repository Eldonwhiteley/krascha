# The Cloudflare Worker behind Skrusty's List, the global leaderboard, served
# at krasha.com. Deploy with node scripts/deploy-worker.mjs, which creates
# the database the first time.
name = "skrusty"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# krasha.com must be a zone in the same Cloudflare account.
routes = [{ pattern = "krasha.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "skrusty"
database_id = "REPLACE_ON_FIRST_DEPLOY"
migrations_dir = "migrations"
